

name: BTC-Alarm

on:

  schedule:

    - cron: "*/10 * * * *"   # startet regelmaessig neu; jeder Lauf prueft 50 Minuten lang alle 2 Minuten

  workflow_dispatch:

    inputs:

      test:

        description: "Testnachricht senden?"

        type: boolean

        default: false

permissions:

  contents: write

concurrency:

  group: btc-alarm-${{ inputs.test == true && 'test' || 'lauf' }}   # ein Test stoppt den laufenden Alarm nicht

  cancel-in-progress: true   # ein neuer Lauf loest den alten ab -> keine Luecken, nichts doppelt

jobs:

  check:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Repository aktiv halten (GitHub pausiert sonst nach 60 Tagen)

        if: github.event_name == 'schedule'

        run: |

          if [ "$(date -u +%d%H)" = "0100" ]; then

            date -u > aktiv.txt

            git config user.name "btc-alarm"; git config user.email "btc-alarm@users.noreply.github.com"

            git add aktiv.txt && git commit -m "aktiv" && git push || true

          fi

      - name: Alarm pruefen

        env:

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

          HC_URL: ${{ secrets.HC_URL }}

          LAUFZEIT_MIN: "50"

          PAUSE_SEK: "120"

        run: |

          if [ "${{ inputs.test }}" = "true" ]; then python rsi_alarm.py test; else python rsi_alarm.py; fi

